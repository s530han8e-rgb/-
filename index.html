<template id="copy-about"><h2>关于我 / About Me</h2><img class="about-avatar" src="media/mianmian.png" alt="绵绵" width="102" height="196"><div lang="zh-CN"><p>你好，我是梁雨晗，也可以叫我 Hanna。我研究生读的是香港浸会大学文化创意写作专业。我关心民族文化和在地文化，尤其关心一种文字、一门手艺、一个地方习俗，怎样进入当地人的日常，又怎样一代一代留下来。</p>
<p>我做女书研究时，最在意的不是这种文字有多奇特，而是游戏里的人为什么非用它不可。她想把话写给谁？有哪些话，只有写下来才说得出口？我喜欢从这样的问题出发，再去想玩家在游戏里能看到什么、能做什么。游戏化对我有意思的地方就在这里：玩家自己做一个选择，再从选择的结果里，慢慢理解人物的处境。</p>
<p>我做过 AI 漫剧，搭自己的工作台，做一款网页游戏。这些事看起来分散，但对我来说是同一种创意练习：一个想法聊到一半，我就想先做出一点能试的东西——一个能点的界面、一段能看的画面、一个能跑起来的片段，然后看别人在哪里停下来、会去点什么。创意对我而言，不是先想出一个完整方案，而是先让东西出来，再从人的反应里把它慢慢改好。我想把这种做事方式，用在民族与在地文化相关的工作里。</p></div><div lang="en"><p>Hi, I’m Hanna Liang. I studied Creative and Cultural Writing at Hong Kong Baptist University for my master’s. I’m interested in local and ethnic cultures, especially how a script, a craft, or a custom becomes part of everyday life and is passed from one generation to the next.</p>
<p>When I was researching Nüshu, I kept thinking about why a character in the game needed to use that particular script. Who was she writing to? What could she say in writing that she couldn’t say aloud? Questions like these help me decide what a player should be able to see and do. What interests me about gamification is that a player can make a choice and come to understand a character’s situation through what happens next.</p>
<p>I’ve made AI animations, built a workbench for myself, and worked on a browser game. To me, they’re all ways of trying out an idea. Halfway through a conversation, I’m already itching to make something someone can try: an interface they can click, a scene they can watch, or a small piece of a game that runs. Then I can see where they pause and what they click. I like making the thing first and improving it as I learn how people respond to it. That’s how I’d like to work on projects about local and ethnic cultures.</p>
</div></template>
<template id="copy-project0"><h2>女书的数字化传播 / Nüshu in Interactive Storytelling</h2><p><strong>一句话介绍</strong>  <br>我以橙光互动叙事作品《阁楼上的仓颉》为案例，研究一款游戏怎样让玩家在人物关系、故事选择和情感参与中接触女书。</p>
<p><strong>我为什么做它</strong>  <br>我想理解，一种文字出现在游戏里以后，玩家能从人物的处境读懂多少。比如，玩家第一次注意到女书，可能是因为角色手里有一封信。顺着情节走下去，玩家才有机会知道她想写给谁、为什么要用这样的文字。对我来说，这个过程比罗列作品用了哪些文化元素更值得研究。</p>
<p><strong>我负责了什么</strong>  <br>我独立完成选题、研究框架、资料梳理、案例分析、撰写和会议展示。梳理了 30 余篇国内外文献与典型案例，再回到游戏里看具体的叙事和互动是怎么组织的。我用「内容、用户、媒介」三个角度整理材料，分别看文化内容怎样进入故事、玩家怎样参与，以及互动媒介带来了什么。</p>
<p><strong>做出来了什么</strong>  <br><strong>本论文获得 2025 年亚太教育研究协会（APERA）最佳论文奖（Best Paper Award）。</strong></p>
<p>论文讨论女书在数字媒介中的文化转译，也让我找到自己接下来想做的方向：从真实的文化语境出发，设计让人能亲自参与的体验。</p>
<p><strong>感悟</strong>  <br>我现在看一个文化题材，会先问它在生活里是怎么用的。女书是写给某个人的，也有它被写下来的时机。玩家如果能顺着一封信去认识写信的人，后来再看那几个字，感受可能就不同了。这个差别让我想继续做文化和游戏化结合的项目。</p><a class="material" href="read/nushu.html"><span>阅读女书论文原文</span><small>站内阅读</small><span aria-hidden="true">↗</span></a></template>
<template id="copy-project1"><h2>兴安盟大地艺术季 · 草原文化研究 / Xing’an League Land Art Season</h2><p><strong>在地文化研究 · 团队策划方案</strong></p>
<p>我参与了兴安盟大地艺术季的前期研究，为科尔沁右翼前旗的艺术季方案梳理草原与在地文化。团队把主题定为「不止草原」。沿着前旗的牧场、村镇和水库走，会遇到靠不同手艺和生计生活的人。我们想让来访者有机会认识这些地方，也认识在这里生活的人。</p>
<p><strong>我在项目里做的事</strong></p>
<p>我参与草原文化挖掘，为团队提供研究与学术支持。方案梳理了乌兰毛都一带的牧业生活、察尔森的冬捕与稻作，也纳入扎萨克图刺绣、传统说唱和沙嘎游戏。对我来说，梳理这些材料时，值得追问的是谁还在用它、什么时候会用，以及当地人怎么把它教给下一代。</p>
<p><strong>研究怎样进入方案</strong></p>
<p>团队按四个驻地来组织体验。比如，察尔森的水库和稻作有各自的生活脉络，方案设想用沿湖骑行和稻秆创作工作坊带人接触这些地方；传统游戏、编绳与非遗说唱也各有面向来访者的参与方式。这一阶段形成了团队汇报方案，包含驻地主题、体验线路和活动构想。</p>
<p><strong>做完以后我在想</strong></p>
<p>做完这份研究，我觉得「草原」两个字说得太快了。再往下看，水库边有冬捕，牧区有自己的游戏和待客方式。我想做的文化策划，可以从这些具体的事开始：让第一次到这里的人，也有机会坐下来，听听一门手艺怎么学，或和当地人一起玩一局他们熟悉的游戏。</p><a class="material" href="read/xingan.html"><span>阅读艺术季方案摘记</span><small>站内阅读</small><span aria-hidden="true">↗</span></a></template>

<p>我先策划了邀请函，再把同一个故事接到公众号互动页。用户点一下纸船，画面会展开成一封冬安信。读完可以回到公众号，回复「纸船」报名。邀请函负责让人看懂这是一场什么活动，互动页则把后面的事说清楚：<strong>11 月 5 日</strong>开放报名，<strong>11 月 12 日</strong>截止并寄出冬安信，页面预告参与者会在 <strong>11 月 13 至 14 日</strong>其中一晚收到来信。页面也写明信件寄出前会审核。活动约有 <strong>500 人</strong>参与书信互动。</p>

<template id="copy-ai4"><h2>东区仍在开放 / The East District Is Still Open</h2><p><strong>已完成 · 浏览器互动叙事游戏</strong></p>
<p>我做这个游戏时，考虑的是少数民族同学怎么在自己熟悉的文化情境里练英语。故事写到回族家庭过古尔邦节，家人准备节日食物，也给邻居送去一份。这样的往来是人物生活的一部分，也是玩家开始理解这个社区的地方。</p>
